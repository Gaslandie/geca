name: Publier la vitrine GECA sur Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluehost-public
  cancel-in-progress: false

jobs:
  publish:
    # Activation seulement après installation et vérification de la connexion.
    if: vars.BLUEHOST_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: bluehost-production
    steps:
      - name: Lire le projet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Vérifier le code
        run: npm run lint
      - name: Construire la vitrine à la racine du domaine
        run: npm run build:public
      - name: Vérifier les types
        run: npm run typecheck
      - name: Installer le navigateur de vérification
        run: npx playwright install --with-deps chromium
      - name: Vérifier les pages et les refus d’accès
        run: npm run test:public
      - name: Préparer l’archive publique vérifiée
        run: npm run package:public
      - name: Publier par la connexion limitée à la vitrine
        run: python3 deploy/send-public.py
        env:
          BLUEHOST_SSH_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
          BLUEHOST_KNOWN_HOSTS: ${{ secrets.BLUEHOST_KNOWN_HOSTS }}
          BLUEHOST_SSH_HOST: ${{ vars.BLUEHOST_SSH_HOST }}
          BLUEHOST_SSH_PORT: ${{ vars.BLUEHOST_SSH_PORT }}
